<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shipping Address</title>

  <!-- Mapbox Search JS marker. The SDK is loaded lazily only when a token is
       configured; without one the form still works via native browser
       autofill. -->
  <script
    id="search-js"
    data-mapbox-token="__NEXT_PUBLIC_MAPBOX_TOKEN__"
  ></script>

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6f7;
      margin: 0;
      padding: 40px 16px;
      color: #1d1d1d;
    }

    .checkout-card {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      padding: 32px;
    }

    .checkout-card h1 {
      margin: 0 0 24px;
      font-size: 22px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
    }

    .form-group label .optional {
      font-weight: 400;
      color: #8a8a8a;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #c0c0c0;
      border-radius: 6px;
      background: #fff;
    }

    .form-group input:focus {
      outline: 2px solid #3a99d8;
      border-color: transparent;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    /* Mapbox dropdown suggestions inherit the input font */
    [data-searchjs="autofill-suggestion"] {
      font-family: inherit;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #1d1d1d;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background: #3a3a3a;
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #form-feedback {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
      color: #2e7d32;
      min-height: 18px;
      word-break: break-word;
    }

    #form-feedback.error {
      color: #b00020;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="checkout-card">
    <h1>Shipping Address</h1>

    <form id="checkout-form" autocomplete="on" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="address1">Address Line 1</label>
        <input
          type="text"
          id="address1"
          name="address1"
          autocomplete="shipping street-address"
          placeholder="Street address"
          required
        />
      </div>

      <div class="form-group">
        <label for="address2">Address Line 2 <span class="optional">(optional)</span></label>
        <input
          type="text"
          id="address2"
          name="address2"
          autocomplete="shipping address-line2"
          placeholder="Apt, suite, unit"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="city">City</label>
          <input
            type="text"
            id="city"
            name="city"
            autocomplete="shipping address-level2"
            placeholder="City"
            required
          />
        </div>
        <div class="form-group">
          <label for="state">State</label>
          <input
            type="text"
            id="state"
            name="state"
            autocomplete="shipping address-level1"
            placeholder="State"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="zip">ZIP / Postal Code</label>
        <input
          type="text"
          id="zip"
          name="zip"
          autocomplete="shipping postal-code"
          placeholder="ZIP"
          inputmode="numeric"
          required
        />
      </div>

      <!-- Entry context (optional). Prefilled from the URL query string. -->
      <input type="hidden" id="context-variant" name="variant" value="" />
      <input type="hidden" id="context-size" name="size" value="" />
      <input type="hidden" id="context-order-ref" name="orderRef" value="" />

      <button type="submit">Save Address</button>
    </form>

    <p id="form-feedback" role="status" aria-live="polite"></p>
    <p class="note" id="autofill-note"></p>
  </div>

  <script>
    (function () {
      'use strict';

      var MAPBOX_PLACEHOLDER = '__NEXT_PUBLIC_MAPBOX_TOKEN__';
      var MAPBOX_SDK_URL = 'https://api.mapbox.com/search-js/v1.6.0/web.js';

      // Local-development fallback token. When YOUR_MAPBOX_ACCESS_TOKEN is
      // missing/undefined and the page is served from localhost, this hardcoded
      // token string is loaded dynamically so Mapbox autofill still works
      // during local testing. Paste your own Mapbox public (pk.*) token here.
      // It is ONLY ever read while window.location.hostname is
      // localhost/127.0.0.1 — never in production.
      var YOUR_MAPBOX_ACCESS_TOKEN = 'pk.YOUR_LOCALHOST_MAPBOX_TOKEN';
      var LOCALHOST_TOKEN_PLACEHOLDER = 'pk.YOUR_LOCALHOST_MAPBOX_TOKEN';

      // ── Mapbox Address Autofill (optional progressive enhancement) ──────
      // The SDK only loads when a token is configured. Without one the form
      // still works via native browser autofill (autocomplete attributes).
      // Token resolution order:
      //   1. window.ENV_MAPBOX_TOKEN    — runtime injection by the hosting layer.
      //   2. data-mapbox-token attr     — injected at build time by
      //      scripts/inject-mapbox-token.mjs from NEXT_PUBLIC_MAPBOX_TOKEN
      //      (or the NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN alias).
      //   3. localhost dev override     — ?mapbox_token=… or localStorage
      //      "mapbox_dev_token" (localhost only — great for testing).
      //   4. hardcoded local fallback   — YOUR_MAPBOX_ACCESS_TOKEN (localhost only).
      function isLocalhost() {
        var host = window.location.hostname;
        return host === 'localhost' || host === '127.0.0.1' || host === '::1';
      }

      function resolveToken() {
        var found = '';
        if (typeof window !== 'undefined' && window.ENV_MAPBOX_TOKEN) {
          found = window.ENV_MAPBOX_TOKEN;
        }
        if (!found) {
          var el = document.getElementById('search-js');
          var attr = el ? el.getAttribute('data-mapbox-token') : '';
          if (attr && attr !== MAPBOX_PLACEHOLDER) found = attr;
        }
        if (!found && isLocalhost()) {
          try {
            var qsToken = new URLSearchParams(window.location.search).get('mapbox_token');
            if (qsToken) found = qsToken.trim();
            var lsToken = window.localStorage.getItem('mapbox_dev_token');
            if (!found && lsToken) found = lsToken.trim();
          } catch (e) { /* ignore */ }
        }
        if (
          !found &&
          isLocalhost() &&
          YOUR_MAPBOX_ACCESS_TOKEN &&
          YOUR_MAPBOX_ACCESS_TOKEN !== LOCALHOST_TOKEN_PLACEHOLDER
        ) {
          found = YOUR_MAPBOX_ACCESS_TOKEN;
        }
        found = String(found || '').trim();
        // Mapbox browser autofill requires a PUBLIC `pk.*` token. A secret
        // `sk.*` token, or a leftover placeholder such as
        // `pk.YOUR_LOCALHOST_MAPBOX_TOKEN`, can NEVER work in the browser and
        // would silently produce "autofill is on but no dropdown" (the SDK
        // loads fine, then every suggest request is rejected — and rejected
        // requests do not bill, so the dashboard shows nothing).
        if (!found || found === LOCALHOST_TOKEN_PLACEHOLDER) return '';
        if (!/^pk\.[A-Za-z0-9_-]{6,}/.test(found)) return '';
        return found;
      }

      function setFeedback(message, isError) {
        var el = document.getElementById('form-feedback');
        if (!el) return;
        el.textContent = message || '';
        el.classList.toggle('error', !!isError);
      }

      function validateAddress(value) {
        var v = String(value || '').trim();
        if (!v) return 'Enter a shipping address.';
        if (v.length < 10) return 'Enter a complete shipping address (street, city, state and ZIP).';
        if (!/\d/.test(v)) return 'Shipping address needs a street number (e.g. "123 Main Street").';
        if (!/[a-zA-Z]/.test(v)) return 'Shipping address needs street or city names.';
        return null;
      }

      var token = resolveToken();
      var note = document.getElementById('autofill-note');
      var autofillReady = false;  // SDK loaded AND autofill is observing the page
      var mapboxVerified = false; // customer picked an address from the dropdown

      function setNote(text, isError) {
        if (!note) return;
        note.textContent = text || '';
        note.style.color = isError ? '#b00020' : '#8a8a8a';
      }

      if (!token) {
        // No token configured anywhere (missing NEXT_PUBLIC_MAPBOX_TOKEN in
        // Vercel / .env.local). Be explicit so this is never a silent mystery.
        setNote('Address autofill is unavailable (Mapbox token not configured). Enter your address manually.');
      } else {
        setNote('Loading address autofill…');
        var sdk = document.createElement('script');
        sdk.src = MAPBOX_SDK_URL;
        sdk.async = true;
        sdk.onload = function () {
          if (window.mapboxsearch && typeof window.mapboxsearch.autofill === 'function') {
            try {
              var collection = window.mapboxsearch.autofill({ accessToken: token, browserAutofillEnabled: true });
              // Mapbox renames an attached input's `autocomplete` to
              // "new-password" on focus/typing (browser-autofill prevention),
              // which makes its own observe()/update() re-scan drop the field
              // and tear the dropdown down. Watch the form and restore the
              // address value so the dropdown survives typing.
              var autocompleteGuard = null;
              if (typeof MutationObserver === 'function') {
                autocompleteGuard = new MutationObserver(function () {
                  var inputs = document.querySelectorAll('#checkout-form input[autocomplete="new-password"]');
                  for (var g = 0; g < inputs.length; g++) {
                    inputs[g].setAttribute('autocomplete', 'shipping street-address');
                  }
                });
                autocompleteGuard.observe(document, { subtree: true, attributes: true, attributeFilter: ['autocomplete'] });
              }
              if (collection && typeof collection.observe === 'function') {
                collection.observe();
              }
              if (collection && typeof collection.addEventListener === 'function') {
                collection.addEventListener('retrieve', function () {
                  // The SDK fills the address fields right after 'retrieve', so
                  // defer one tick before marking the form as verified.
                  setTimeout(function () {
                    mapboxVerified = true;
                    var f = document.getElementById('checkout-form');
                    if (f) f.setAttribute('data-mapbox-verified', 'true');
                  }, 0);
                });
                collection.addEventListener('suggesterror', function (ev) {
                  var detail = ev && ev.detail;
                  var msg = detail && detail.message ? detail.message : String(detail || 'error');
                  console.warn('[mapbox-autofill] Suggest error:', msg);
                  if (/401|403|unauthorized|forbidden|access token|invalid token/i.test(msg)) {
                    console.error(
                      '[mapbox-autofill] Mapbox is REJECTING the access token. Use a public pk.* token ' +
                      'and make sure its URL restrictions include this host.'
                    );
                  }
                });
              }
              // Only treat autofill as "ready" (i.e. enforce pick-from-dropdown)
              // when the SDK actually attached a dropdown listbox to the page.
              // "collection created" alone means nothing if the token is invalid.
              var attached = document.querySelectorAll('mapbox-search-listbox').length > 0;
              autofillReady = attached;
              if (attached) {
                setNote('Start typing in "Address Line 1" to autofill the rest.');
              } else {
                setNote('Address autofill loaded but could not attach — enter your address manually.', true);
                console.warn('[mapbox-autofill] SDK loaded but no dropdown was attached. Check the Mapbox token and its URL restrictions for this domain.');
              }
            } catch (err) {
              console.error('[autofill] init failed', err);
              setNote('Address autofill could not start — enter your address manually.', true);
            }
          } else {
            setNote('Address autofill could not start — enter your address manually.', true);
          }
        };
        sdk.onerror = function () {
          setNote('Address autofill could not start — enter your address manually.', true);
        };
        document.head.appendChild(sdk);
      }

      // ── Prefill from the URL query string ──────────────────────────────────
      // Lets the page be sent as a link for a specific order.
      (function prefill() {
        var params = new URLSearchParams(window.location.search);
        var email = params.get('email');
        if (email) document.getElementById('email').value = email;
        var map = {
          variant: 'context-variant',
          size: 'context-size',
          orderRef: 'context-order-ref'
        };
        Object.keys(map).forEach(function (key) {
          var val = params.get(key);
          if (val) document.getElementById(map[key]).value = val;
        });
      })();

      // ── Submit → POST to /api/address/save (persisted to the store) ────────
      document.getElementById('checkout-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        var form = event.target;
        var submit = form.querySelector('button[type="submit"]');

        // Read fields by element ID, not by FormData name: Mapbox's SDK renames
        // the street-address input it attaches to (`address1` becomes
        // `address1 address-search`), so `FormData.get('address1')` returns null
        // whenever autofill is active.
        var email = String(document.getElementById('email').value || '').trim();
        var line1 = String(document.getElementById('address1').value || '').trim();
        var line2 = String(document.getElementById('address2').value || '').trim();
        var city = String(document.getElementById('city').value || '').trim();
        var state = String(document.getElementById('state').value || '').trim();
        var zip = String(document.getElementById('zip').value || '').trim();
        var variant = document.getElementById('context-variant').value;
        var size = document.getElementById('context-size').value;
        var orderRef = document.getElementById('context-order-ref').value;
        var cityStateZip = [city, state, zip].filter(Boolean).join(', ');
        var address = [line1, line2, cityStateZip].filter(Boolean).join(', ');

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setFeedback('Please enter a valid email address.', true);
          return;
        }
        var addrErr = validateAddress(address);
        if (addrErr) {
          setFeedback(addrErr, true);
          return;
        }
        // Autofill is a convenience, not a lock-in — structural validation above
        // already blocks garbage addresses. Customers can pick a suggestion for
        // a pre-verified fill, or type a complete address manually.

        setFeedback('Saving…');
        submit.disabled = true;
        try {
          var res = await fetch('/api/address/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: email,
              address: address,
              verified: mapboxVerified ? true : undefined,
              variant: variant || undefined,
              size: size || undefined,
              orderRef: orderRef || undefined,
              source: 'address-form'
            })
          });
          var result = await res.json().catch(function () { return {}; });
          if (res.ok && result.success) {
            setFeedback(result.message || 'Address saved.');
          } else {
            setFeedback(result.error || 'Could not save the address. Please try again.', true);
          }
        } catch (err) {
          setFeedback('Could not reach the server. Open this page from the store site, not as a local file.', true);
        } finally {
          submit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
