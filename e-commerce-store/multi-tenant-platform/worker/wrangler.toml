# Cloudflare Worker — multi-tenant edge template renderer.
#
# Local dev (uses [vars] + .dev.vars):
#   cp .dev.vars.example .dev.vars       # fill in SUPABASE_URL / SUPABASE_ANON_KEY / FLUSH_CACHE_SECRET
#   npx wrangler dev
# Deploy:
#   npx wrangler kv namespace create SITE_CACHE          # once — paste the id below
#   npx wrangler secret put SUPABASE_URL                 # e.g. https://xxxx.supabase.co
#   npx wrangler secret put SUPABASE_ANON_KEY            # the anon/public key (RLS-gated reads)
#   npx wrangler secret put FLUSH_CACHE_SECRET           # bearer secret guarding POST /api/flush-cache
#   npx wrangler deploy
name = "template-edge-renderer"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# The compiled per-tenant cache namespace. Create it first and paste the id:
#   npx wrangler kv namespace create SITE_CACHE
#   -> "Successfully created KV namespace 'SITE_CACHE' with id: <paste this>"
[[kv_namespaces]]
binding = "SITE_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Apex of the platform — tenant subdomains live one level under it:
#   demo.yourplatform.com → tenant key "demo"
PLATFORM_ROOT_DOMAIN = "yourplatform.com"
# How long a compiled site payload stays in KV (the spec's 24h default).
SITE_CACHE_TTL_SECONDS = "86400"
# Bump to invalidate every cached tenant at once (see cacheKeyForSite).
CACHE_VERSION = "1"

# Runtime secrets — NEVER commit; read from the environment via `wrangler secret put`:
#   SUPABASE_URL          e.g. https://xxxx.supabase.co
#   SUPABASE_ANON_KEY     the anon/public key (RLS gates reads to published sites)
#   FLUSH_CACHE_SECRET    shared bearer secret that the Admin Portal sends to
#                         POST /api/flush-cache (see src/flush.ts)
