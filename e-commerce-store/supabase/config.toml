# =============================================================================
# Supabase project configuration.
#
# `project_id` pins this config to the linked Supabase project so that
# `supabase db push` (and the rest of the CLI) work from THIS directory without
# needing `--linked` on every command. It matches the project ref stored in
# `supabase/.temp/project-ref` (set by `supabase link`).
#
# ⚠️ Do NOT put secrets here — this file is committed. Secrets live in
# `.env.local` / the hosting platform / the Supabase dashboard.
# =============================================================================
project_id = "ihtwipjsxnvfycnsnvly"

[api]
enabled = true
port = 54321
# Schemas exposed through PostgREST.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the remote database's major version (currently Postgres 17).
major_version = 17

[studio]
enabled = true
port = 54323

[analytics]
enabled = true
port = 54327
vector_port = 54328

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[storage]
enabled = true
file_size_limit = "50MiB"

[inbucket]
enabled = true
port = 54324
