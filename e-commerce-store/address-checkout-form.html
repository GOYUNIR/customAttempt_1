<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Address Checkout Form</title>

  <!-- Mapbox Search JS (Address Autofill) from the Mapbox CDN -->
  <script id="search-js" defer src="https://api.mapbox.com/search-js/v1.6.0/web.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f6f7;
      margin: 0;
      padding: 40px 16px;
      color: #1d1d1d;
    }

    .checkout-card {
      max-width: 480px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      padding: 32px;
    }

    .checkout-card h1 {
      margin: 0 0 24px;
      font-size: 22px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #c0c0c0;
      border-radius: 6px;
      background: #fff;
    }

    .form-group input:focus {
      outline: 2px solid #3a99d8;
      border-color: transparent;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    button[type="submit"] {
      width: 100%;
      margin-top: 8px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: #1d1d1d;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      background: #3a3a3a;
    }

    #form-feedback {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
    }

    .note {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="checkout-card">
    <h1>Shipping Address</h1>

    <form id="checkout-form" autocomplete="on">
      <!-- Address line 1 -->
      <div class="form-group">
        <label for="address1">Address Line 1</label>
        <input
          type="text"
          id="address1"
          name="address1"
          autocomplete="shipping street-address"
          placeholder="Street address"
          required
        />
      </div>

      <!-- Address line 2 -->
      <div class="form-group">
        <label for="address2">Address Line 2</label>
        <input
          type="text"
          id="address2"
          name="address2"
          autocomplete="shipping address-line2"
          placeholder="Apt, suite, unit (optional)"
        />
      </div>

      <div class="form-row">
        <!-- City -->
        <div class="form-group">
          <label for="city">City</label>
          <input
            type="text"
            id="city"
            name="city"
            autocomplete="shipping address-level2"
            placeholder="City"
            required
          />
        </div>

        <!-- State -->
        <div class="form-group">
          <label for="state">State</label>
          <input
            type="text"
            id="state"
            name="state"
            autocomplete="shipping address-level1"
            placeholder="State"
            required
          />
        </div>
      </div>

      <!-- ZIP / Postal code -->
      <div class="form-group">
        <label for="zip">ZIP / Postal Code</label>
        <input
          type="text"
          id="zip"
          name="zip"
          autocomplete="shipping postal-code"
          placeholder="ZIP"
          inputmode="numeric"
          required
        />
      </div>

      <button type="submit">Place Order</button>
    </form>

    <p id="form-feedback"></p>
    <p class="note">
      Start typing in "Address Line 1" and pick a suggestion — the remaining
      fields (Address 2, City, State, ZIP) are filled in automatically.
    </p>
  </div>

  <script>
    // Mapbox access token — resolved dynamically at runtime instead of being
    // hardcoded in this file. Never commit a real token here.
    //
    // Resolution order:
    //   1. window.ENV_MAPBOX_TOKEN — injected at runtime by the hosting layer
    //      (e.g. a server/edge bootstrap script that sets
    //      window.ENV_MAPBOX_TOKEN = process.env.NEXT_PUBLIC_MAPBOX_TOKEN
    //      before this file runs).
    //   2. process.env.NEXT_PUBLIC_MAPBOX_TOKEN — the standard Next.js public
    //      env var; tooling/build steps can inline it into the page.
    //
    // Generate your own token here:
    //   https://account.mapbox.com/access-tokens/
    const YOUR_MAPBOX_ACCESS_TOKEN =
      (typeof window !== 'undefined' && window.ENV_MAPBOX_TOKEN) ||
      (typeof process !== 'undefined' && process.env.NEXT_PUBLIC_MAPBOX_TOKEN) ||
      '';

    // Initialize Mapbox Address Autofill once the page has fully loaded.
    // The library discovers eligible inputs inside the <form> by their
    // HTML autocomplete attributes (e.g. "shipping street-address") and
    // fills in the whole address when a suggestion is selected.
    window.addEventListener('load', () => {
      if (!YOUR_MAPBOX_ACCESS_TOKEN) {
        document.getElementById('form-feedback').textContent =
          'Mapbox access token not configured. Set NEXT_PUBLIC_MAPBOX_TOKEN or inject window.ENV_MAPBOX_TOKEN.';
        return;
      }
      if (!window.mapboxsearch || typeof window.mapboxsearch.autofill !== 'function') {
        document.getElementById('form-feedback').textContent =
          'Mapbox Search JS failed to load.';
        return;
      }
      window.mapboxsearch.autofill({
        accessToken: YOUR_MAPBOX_ACCESS_TOKEN,
      });
    });

    // Simple demo submit handler — no backend here, so just prevent the
    // page reload and show the collected address values.
    document.getElementById('checkout-form').addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(event.target);
      const address = [
        data.get('address1'),
        data.get('address2'),
        [data.get('city'), data.get('state'), data.get('zip')].filter(Boolean).join(', '),
      ]
        .filter(Boolean)
        .join(', ');
      const feedback = document.getElementById('form-feedback');
      feedback.textContent = 'Submitted: ' + address;
    });
  </script>
</body>
</html>
